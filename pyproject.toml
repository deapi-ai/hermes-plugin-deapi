# Development settings only: Hermes loads this plugin from plugin.yaml + __init__.py,
# and it needs no packages beyond what Hermes already ships (requests).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
