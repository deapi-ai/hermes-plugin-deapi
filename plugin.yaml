name: deapi
version: 0.4.0
description: "deAPI backends for image_generate, video_generate, text_to_speech and speech-to-text: text-to-image, image editing, text-to-video, image-to-video, preset-voice speech and transcription on deAPI's native API, with models from the key's live catalog."
author: deAPI
kind: backend
license: MIT
requires_hermes: ">=0.22.0"
requires_env:
  - name: DEAPI_API_KEY
    description: "deAPI API key"
    url: "https://app.deapi.ai/settings/api-keys"
    secret: true
